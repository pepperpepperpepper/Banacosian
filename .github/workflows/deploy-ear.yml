name: Deploy ear.uh-oh.wtf

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BANACOSIAN_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BANACOSIAN_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to S3 + invalidate CloudFront
        run: bash ./deploy-ear.sh
